name: Refresh contribution heatmap

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/gen_heatmap.py ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git diff --quiet assets/contrib-heatmap.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-heatmap.svg
          git commit -m "chore: refresh contribution heatmap"
          git push
